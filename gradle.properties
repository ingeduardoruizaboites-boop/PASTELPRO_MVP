# PastelPro · Gradle properties
# Ajustado para Codespaces (~7.8 GB RAM, contenedor con otras JVMs)

# ── Gradle daemon: bajar a 1.5 GB (era 2 GB) ──
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Kotlin compile daemon: limitar a 1 GB ──
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m

# ── Un solo proyecto: paralelo no aporta, resta memoria ──
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.workers.max=2

# ── Android ──
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ── Kotlin ──
kotlin.code.style=official
kotlin.incremental=true
